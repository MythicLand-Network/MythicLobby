plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.0'
}

apply from: rootProject.file('../MythicFramework/gradle/runtime-library-manifest.gradle')
apply from: rootProject.file('../MythicFramework/gradle/spigot-1.8.8.gradle')

group = 'cn.mythicland'
version = '1.0.0'

repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/repository/public/' }
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
    maven { url = 'https://repo.dmulloy2.net/repository/public/' }
    maven { url = 'https://repo.dmulloy2.net/nexus/repository/public/' }
    maven { url = 'https://repo.extendedclip.com/releases/' }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

configurations {
    runtimeLibraries
}

dependencies {
    compileOnly 'org.reflections:reflections:0.10.2'
    compileOnly 'fr.mrmicky:fastboard:2.1.5'
    compileOnly 'it.unimi.dsi:fastutil:8.5.13'

    firstParty 'cn.mythicland:mythic-framework-core:1.0.0'
    firstParty 'cn.mythicland:mythic-framework-bukkit:1.0.0'
    firstParty 'cn.mythicland:mythic-npclib:1.0.0'

    runtimeLibraries 'fr.mrmicky:fastboard:2.1.5'

    compileOnly files(spigot188Jar)
    compileOnly 'net.dmulloy2:ProtocolLib:5.4.0'
    compileOnly 'me.clip:placeholderapi:2.11.7'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation files(spigot188Jar)
    testImplementation 'net.dmulloy2:ProtocolLib:5.4.0'
    testImplementation 'org.reflections:reflections:0.10.2'
    testImplementation 'fr.mrmicky:fastboard:2.1.5'
    testImplementation 'it.unimi.dsi:fastutil:8.5.13'
}

tasks.named('compileJava') {
    dependsOn tasks.named('prepareSpigot188')
}

tasks.named('compileTestJava') {
    dependsOn tasks.named('prepareSpigot188')
}

def generatedResources = layout.buildDirectory.dir('generated/runtime-resources')
def runtimeDependencyManifest = registerRuntimeLibraryManifest(
        'generateRuntimeDependencyManifest',
        generatedResources,
        'META-INF/mythiclobby-libraries.properties',
        [bukkit: configurations.runtimeLibraries]
)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs '-Xshare:off'
}

tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion.set('')
}

tasks.named('processResources') {
    dependsOn runtimeDependencyManifest
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.named('shadowJar') {
    archiveFileName = 'MythicLobby.jar'
    configurations = [project.configurations.firstPartyEmbedded]
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    dependsOn runtimeDependencyManifest
}

tasks.named('jar') {
    archiveFileName = 'MythicLobby-plain.jar'
}

tasks.named('sourcesJar') {
    archiveFileName = 'MythicLobby-sources.jar'
    dependsOn runtimeDependencyManifest
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}
