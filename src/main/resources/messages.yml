# 所有消息支持 & 颜色代码。
# 如果某条消息需要显示前缀, 请手动加入 {prefix} 占位符。
# 下方示例消息默认不显式包含 {prefix}。

prefix: '&7[&dMythicLobby&7]&r '

command:
  reload:
    success: '&a已重载配置。'
  setspawn:
    failed: '&c大厅出生点设置失败。'
    success: '&a已将当前位置设置为大厅出生点。'
  spawn:
    disabled: '&c大厅主配置未启用！'
    spawn_disabled: '&c大厅出生点功能未启用！'
    spawn_not_set: '&c大厅出生点尚未设置。'

menu:
  open:
    no_permission: '&c你没有权限打开这个菜单。'
    not_found: '&c未找到名为 &e{0} &c的菜单。'

hologram:
  create:
    invalid_name: '&c悬浮字名称不能为空, 且不能包含 .'
    empty_display: '&c悬浮字显示内容不能为空！'
    duplicate_or_invalid: '&c同名悬浮字已存在, 或输入内容无效。'
    success: '&a悬浮字 &e{0} &a已在你当前位置创建。'
  remove:
    not_found: '&c未找到名为 &e{0} &c的悬浮字。'
    success: '&a悬浮字 &e{0} &a已删除。'

npc:
  create:
    failed: '&cNPC 创建失败。'
    success: '&aNPC 已创建。'
  remove:
    success: '&aNPC &e{0} &a已删除。'
  select:
    required: '&c你还没有选中任何 NPC。'
    not_found: '&c未找到名为 &e{0} &c的NPC。'
    none_in_sight: '&c你视线前方10格内没有可选中的NPC。'
    success: '&a已选中 NPC &e{0}&a。'
  tph:
    success: '&a已将 NPC &e{0} &a传送到你当前位置。'
  cmd:
    add:
      success: '&a已为 NPC &e{0} &a添加命令: &f/{1}&a。'
    remove:
      out_of_range: '&c命令索引超出范围。'
      success: '&a已删除 NPC &e{0} &a的第 &e{1} &a条命令。'
    list:
      header: '&aNPC &e{0} &a的命令列表:'
      empty: '&7暂无绑定命令。'
      entry: '&e{0}. &f/{1}'
    clear:
      success: '&a已清空 NPC &e{0} &a的命令, 共移除 &e{1} &a条。'
