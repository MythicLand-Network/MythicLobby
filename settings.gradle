pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'MythicLobby'

def frameworkDirectory = file('../MythicFramework')
def npcLibDirectory = file('../MythicNPCLib')

if (!frameworkDirectory.isDirectory()) {
    throw new GradleException("Missing sibling project MythicFramework: ${frameworkDirectory}")
}
if (!npcLibDirectory.isDirectory()) {
    throw new GradleException("Missing sibling project MythicNPCLib: ${npcLibDirectory}")
}

includeBuild(frameworkDirectory)
includeBuild(npcLibDirectory)
